<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libri — Trouvez votre prochaine lecture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header-site">
    <h1 class="logo">Libri</h1>
    <!-- Recherche : mise en page seulement. Le JavaScript viendra plus tard. -->
    <div class="recherche" role="search">
      <label for="recherche" class="visuellement-cache">Rechercher un livre par titre</label>
      <input type="search" id="recherche" class="champ-recherche" placeholder="Rechercher un livre…" autocomplete="off">
    </div>
  </header>

  <main class="contenu-principal">
    <!-- Filtres toujours visibles (besoin du persona). Mise en page seulement pour l'instant. -->
    <aside class="filtres" aria-label="Filtres">
      <div class="filtre-groupe">
        <label for="filtre-genre">Genres</label>
        <select id="filtre-genre">
          <option>Tous</option>
          <option>Roman</option>
          <option>Essai</option>
          <option>Fictif</option>
          <option>Roman policier</option>
          <option>Psychologie</option>
          <option>Philosophie</option>
        </select>
      </div>
      <div class="filtre-groupe">
        <label for="filtre-pages">Nombre de pages</label>
        <select id="filtre-pages">
          <option>Tous</option>
          <option>Moins de 200 pages</option>
          <option>200 à 299 pages</option>
          <option>300 à 399 pages</option>
          <option>400 pages et plus</option>
        </select>
      </div>
    </aside>

    <h2 id="titre-liste" class="visuellement-cache">Catalogue des livres</h2>
    <section id="liste-cartes" class="cartes-grille" aria-labelledby="titre-liste" aria-live="polite">
      <!-- Les cartes seront injectées ici par app.js -->
    </section>
  </main>

  <footer class="footer-site">
    <p>&copy; 2026 — Libri · Projet ICT 291</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
